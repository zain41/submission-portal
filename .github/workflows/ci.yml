    - name: Run tests with pytest
      run: |
        pytest test_app.py -v --json-report --json-report-file=report.json || true

    - name: Add metadata and send report to localhost
      run: |
        python -c "
        import json, os, datetime
        
        # Load the report generated by pytest
        with open('report.json', 'r') as f:
            data = json.load(f)
            
        # Extract summary
        passed = data.get('summary', {}).get('passed', 0)
        failed = data.get('summary', {}).get('failed', 0)
        total = data.get('summary', {}).get('total', 0)
        
        # Add custom fields requested by the assignment
        data['metadata'] = {
            'repository': os.environ.get('GITHUB_REPOSITORY'),
            'branch': os.environ.get('GITHUB_REF_NAME'),
            'commit_sha': os.environ.get('GITHUB_SHA'),
            'run_id': os.environ.get('GITHUB_RUN_ID'),
            'timestamp': datetime.datetime.utcnow().isoformat() + 'Z'
        }
        
        # Add flat test counts and overall status
        data['test_counts'] = {
            'total': total,
            'passed': passed,
            'failed': failed,
            'overall_status': 'PASS' if failed == 0 else 'FAIL'
        }
        
        # Save the modified report
        with open('final_report.json', 'w') as f:
            json.dump(data, f, indent=2)
        "
        
        curl -X POST -H "Content-Type: application/json" \
             -H "ngrok-skip-browser-warning: true" \
             -d @final_report.json https://blatancy-easiest-pope.ngrok-free.dev
name: Automated Tests

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Run tests and generate JSON report. 
    # "|| true" ensures the pipeline continues to the next step even if tests fail, so we can send the report.
    - name: Run tests with pytest
      run: |
        pytest test_app.py -v --json-report --json-report-file=report.json || true

    # Send the report to your local machine via ngrok
    - name: Send report to localhost
      run: |
        curl -X POST -H "Content-Type: application/json" \
             -H "ngrok-skip-browser-warning: true" \
             -d @report.json https://blatancy-easiest-pope.ngrok-free.dev